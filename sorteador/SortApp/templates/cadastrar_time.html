{% extends 'base.html' %}

{% block content %}
<div class="container-fluid py-5 champions-bg">

    <div class="row justify-content-center mb-5">
        <div class="col-lg-8 text-center">
            <h1 class="fw-bold text-light champions-title mb-0">
                Cadastrar Time
            </h1>
            <p class="text-secondary mb-0">Cedro Champions Cup</p>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-6">

            <div class="champions-card p-4">

                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="champions-form">

                        <p>
                            {{ form.nome.label_tag }}
                            {{ form.nome }}
                        </p>

                        <p>
                            <label class="form-label text-light">Escudo do Time</label>

                            <label for="id_escudo" class="file-upload-btn">
                                Escolher escudo
                            </label>

                            {{ form.escudo }}

                            <span id="file-name" class="file-name">
                                Nenhum arquivo selecionado
                            </span>
                        </p>

                    </div>

                    <div class="d-flex justify-content-end gap-3 mt-4">
                        <a href="{% url 'listar_times' %}" class="btn btn-danger px-4">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-success px-4">
                            Salvar
                        </button>
                    </div>

                </form>

            </div>

        </div>
    </div>

</div>

<style>

.champions-bg {
    min-height: 100vh;
    background: radial-gradient(circle at top, #1b3a6f, #0a1428 70%);
}

.champions-title {
    font-size: 2.6rem;
    border-bottom: 3px solid #1e90ff;
    display: inline-block;
    padding-bottom: 10px;
}

.champions-card {
    background: rgba(255, 255, 255, 0.06);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

.champions-form p {
    margin-bottom: 1.2rem;
}

.champions-form label {
    color: #dbe9ff;
    font-weight: 600;
}

.champions-form input,
.champions-form select {
    background: rgba(10, 20, 40, 0.8);
    border: 1px solid rgba(255,255,255,0.2);
    color: #ffffff;
    border-radius: 10px;
    padding: 10px;
}

.champions-form input:focus,
.champions-form select:focus {
    background: rgba(10, 20, 40, 0.9);
    border-color: #1e90ff;
    box-shadow: 0 0 0 0.15rem rgba(30,144,255,0.25);
    color: #ffffff;
}

.champions-form input[type="file"] {
    display: none;
}

.file-upload-btn {
    display: inline-block;
    background: linear-gradient(to right, #1e90ff, #0a58ca);
    color: #ffffff;
    padding: 10px 18px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.25s ease;
}

.file-upload-btn:hover {
    filter: brightness(1.15);
    transform: scale(1.05);
}

.file-name {
    display: block;
    margin-top: 8px;
    color: #9fbfff;
    font-size: 0.9rem;
}
</style>

<script>
document.getElementById("id_escudo").addEventListener("change", function () {
    const fileName = this.files.length
        ? this.files[0].name
        : "Nenhum arquivo selecionado";
    document.getElementById("file-name").innerText = fileName;
});
</script>

{% endblock %}
